<svg xmlns="http://www.w3.org/2000/svg" width="512" height="1024" viewBox="0 0 512 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0ea5e9" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="512" height="1024" fill="url(#bg)"/>
  <rect width="512" height="1024" fill="url(#grid)"/>
  <!-- subtle decorative circles -->
  <circle cx="440" cy="140" r="120" fill="#0ea5e9" opacity="0.06"/>
  <circle cx="60" cy="520" r="160" fill="#0284c7" opacity="0.05"/>
  <circle cx="420" cy="880" r="140" fill="#38bdf8" opacity="0.07"/>
</svg>
